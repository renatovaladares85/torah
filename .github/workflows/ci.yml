name: CI

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and privacy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, mysqli, intl, xml
          tools: composer:v2
          coverage: none

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes gettext libxml2-utils ripgrep

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate metadata and source
        run: |
          composer validate --strict --no-check-lock
          xmllint --noout plugin.xml
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          msgfmt --check --check-compatibility --output-file=/dev/null locales/pt_BR.po
          composer qa

      - name: Build release package
        run: tests/Packaging/package.sh

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: torah-package
          path: |
            dist/torah-*.tar.gz
            dist/torah-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  glpi-smoke:
    name: GLPI ${{ matrix.glpi }} ${{ matrix.package }} smoke
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - glpi: '10.0.20'
            package: tar.gz
          - glpi: '10.0.25'
            package: zip
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: glpi
          MARIADB_USER: glpi
          MARIADB_PASSWORD: glpi_test_password
          MARIADB_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out Torah
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: apcu, bz2, curl, gd, intl, json, ldap, mbstring, mysqli, sodium, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install artifact validation tools
        run: sudo apt-get update && sudo apt-get install --yes gettext libxml2-utils unzip ripgrep

      - name: Download production package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: torah-package
          path: dist

      - name: Prepare GLPI
        env:
          GLPI_VERSION: ${{ matrix.glpi }}
          TORAH_PACKAGE_FORMAT: ${{ matrix.package }}
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/glpi-project/glpi/releases/download/${GLPI_VERSION}/glpi-${GLPI_VERSION}.tgz" \
            --output "$RUNNER_TEMP/glpi.tgz"
          tar --extract --gzip --file="$RUNNER_TEMP/glpi.tgz" --directory="$RUNNER_TEMP"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          package="$(find dist -maxdepth 1 -type f -name "torah-*.${TORAH_PACKAGE_FORMAT}" -print -quit)"
          test -n "$package"
          tools/validate-package.sh "$package"
          case "$TORAH_PACKAGE_FORMAT" in
            tar.gz) tar --extract --gzip --file="$package" --directory="$RUNNER_TEMP/glpi/plugins" ;;
            zip) unzip -q "$package" -d "$RUNNER_TEMP/glpi/plugins" ;;
            *) exit 1 ;;
          esac
          test -d "$RUNNER_TEMP/glpi/plugins/torah"
          test ! -e "$RUNNER_TEMP/glpi/plugins/torah/composer.json"
          test ! -e "$RUNNER_TEMP/glpi/plugins/torah/vendor"
          find "$RUNNER_TEMP/glpi/plugins/torah" -maxdepth 3 -type f | sort
          php "$RUNNER_TEMP/glpi/bin/console" database:install --no-interaction \
            --db-host=127.0.0.1 --db-name=glpi --db-user=glpi \
            --db-password=glpi_test_password --default-language=en_GB --no-telemetry

      - name: Exercise plugin lifecycle
        run: |
          php "$RUNNER_TEMP/glpi/bin/console" plugin:install --no-interaction --username=glpi torah
          php "$RUNNER_TEMP/glpi/bin/console" plugin:activate --no-interaction torah
          php "$RUNNER_TEMP/glpi/bin/console" plugin:deactivate --no-interaction torah
          php "$RUNNER_TEMP/glpi/bin/console" plugin:activate --no-interaction torah
          php "$RUNNER_TEMP/glpi/bin/console" plugin:uninstall --no-interaction torah
          php "$RUNNER_TEMP/glpi/bin/console" plugin:install --no-interaction --username=glpi torah
          php "$RUNNER_TEMP/glpi/bin/console" plugin:activate --no-interaction torah

      - name: Run GLPI integration tests
        env:
          GLPI_ROOT: ${{ runner.temp }}/glpi
        run: vendor/bin/phpunit --group glpi-integration
